<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>EDIT THE DAY 27FW 발표</title>
<style>:root{box-sizing:border-box}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* 발표 화면: 16:9 무대 한 장씩, 하단 조작 띠, 레퍼런스 칸 클릭 시 딤 팝업. 어두운 단일 테마 */
:root{--bg:#0C0C0D;--fg:#F2F0EB;--mute:#9A958F;--rule:#2B2A29;--chip:#1C1B1B;--accent:#C34121;--dim:rgba(6,6,7,.86);--font:"PretendardLive","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);letter-spacing:0;overflow:hidden}
.app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hall{flex:1;min-height:0;display:grid;place-items:center}
.stage{position:relative;background:#000;overflow:hidden;box-shadow:0 0 0 1px var(--rule)}
.slide{position:absolute;inset:0;visibility:hidden;pointer-events:none}
.slide.cur{visibility:visible;pointer-events:auto}
.slide>img{display:block;width:100%;height:100%;max-width:100%;object-fit:cover;object-position:left top;user-select:none;-webkit-user-drag:none}
/* 장 본문: 캡처 이미지가 아닌 실제 글자. 1280x720 기준으로 놓고 무대 폭에 맞춰 축소 */
.pg{position:absolute;inset:0;overflow:hidden}
.pg .t{position:absolute}
.pg p{margin:0;word-break:normal}
.pg i{display:block}
.msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:14px}
.bar{display:flex;align-items:center;gap:10px;min-height:36px;font-size:13px;color:var(--mute);transition:opacity .2s}
.bar button{font:inherit;color:var(--fg);background:var(--chip);border:1px solid var(--rule);border-radius:4px;height:32px;min-width:36px;padding:0 12px;cursor:pointer}
.bar button:hover{border-color:var(--mute)}
.bar button:focus-visible,.lb button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.bar button[disabled]{opacity:.35;cursor:default}
#ct{color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
#tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{flex:1}
.prog{height:2px;background:var(--rule)}
.prog i{display:block;height:100%;width:0;background:var(--fg);transition:width .2s}
.app.idle .bar,.app.idle .prog{opacity:0}
.app.full{padding-block:0;gap:0}
.app.full .bar,.app.full .prog{position:fixed;left:0;right:0;z-index:5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app.full .bar{bottom:0;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.72))}
.app.full .prog{bottom:0;background:transparent}

/* 장 위에 얹는 레퍼런스 칸(뷰어와 동일 규격, 1280x720 기준) */
.ov{position:absolute;inset:0;overflow:hidden}
.ovi{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;transform:scale(var(--k,1));color:#111;letter-spacing:0}
.ov img{width:100%;height:100%;max-width:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;display:block}
.hd{position:absolute;width:285px;font-size:14px;line-height:18px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd.mute{color:rgba(255,255,255,.6)}
.hs{margin-left:8px;font-size:11px;font-weight:400;color:rgba(255,255,255,.7)}
.ov video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
.vd{position:relative}
.pl{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(17,17,17,.55);pointer-events:none}
.pl::before{content:"";position:absolute;left:17px;top:13px;border-style:solid;border-width:9px 0 9px 14px;border-color:transparent transparent transparent #fff}
.rw{position:absolute;width:285px;font-size:12px;line-height:16px;color:#fff}
.rw div{display:block;border-top:1px solid rgba(255,255,255,.35);padding:6px 0 7px}
.rw span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac{position:absolute;width:285px;box-sizing:border-box;border-top:1px solid rgba(255,255,255,.35);padding-top:5px;font-size:10.5px;line-height:14px;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.ac a:hover{color:#fff}
.wait{position:absolute;width:285px;box-sizing:border-box;border:1px dashed rgba(255,255,255,.45);display:grid;place-items:center;color:rgba(255,255,255,.6);font-size:12px}
.igm{position:absolute;width:285px;background:transparent;overflow:hidden;cursor:zoom-in}
.trk{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.trk::-webkit-scrollbar{display:none}
.trk>div{flex:0 0 100%;height:100%;scroll-snap-align:start}
.igm button{position:absolute;top:50%;width:26px;height:26px;margin-top:-13px;border:0;border-radius:50%;background:rgba(255,255,255,.92);cursor:pointer;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.25);opacity:0;transition:opacity .15s}
.igm:hover button,.igm button:focus-visible{opacity:1}
.igm button::before{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-top:1.5px solid #111;border-right:1.5px solid #111}
.igm .pv{left:8px}.igm .pv::before{transform:translate(-30%,-50%) rotate(-135deg)}
.igm .nx{right:8px}.igm .nx::before{transform:translate(-70%,-50%) rotate(45deg)}
.igm button[disabled]{display:none}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:4px;pointer-events:none}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 2px rgba(0,0,0,.35)}.dots i.on{background:#fff}

/* 딤 팝업 */
.lb{position:fixed;inset:0;z-index:20;background:var(--dim);display:flex;align-items:center;justify-content:center;gap:32px;box-sizing:border-box;padding:max(24px,env(safe-area-inset-top,0px)) max(64px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(64px,env(safe-area-inset-left,0px))}
.lb-m{flex:0 1 auto;min-width:0;height:100%;display:grid;place-items:center}
.lb-m img,.lb-m video{display:block;height:min(88vh,100%);width:auto;max-width:min(62vw,100%);object-fit:contain;background:transparent}
.lb-t{flex:0 0 300px;display:flex;flex-direction:column;gap:0;font-size:15px;line-height:22px;color:#fff}
.lb-t h2{margin:0 0 14px;font-size:22px;line-height:28px;font-weight:700}
.lb-t h2 span{display:block;margin-top:4px;font-size:14px;line-height:20px;font-weight:400;color:rgba(255,255,255,.7)}
.lb-t p{margin:0;border-top:1px solid rgba(255,255,255,.35);padding:10px 0 11px;word-break:keep-all}
.lb-t .lb-a{border-top:1px solid rgba(255,255,255,.35);padding:10px 0 11px;font-size:13px;line-height:20px;color:rgba(255,255,255,.75);word-break:break-all}
.lb-t .lb-a a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.lb-t .lb-a a:hover{color:#fff}
.lb-t .lb-c{border-top:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.6);font-size:13px;font-variant-numeric:tabular-nums}
.lb button{position:absolute;border:1px solid rgba(255,255,255,.35);background:rgba(20,20,20,.6);color:#fff;border-radius:50%;width:44px;height:44px;cursor:pointer;font:inherit;font-size:22px;line-height:1;padding:0}
.lb button:hover{border-color:#fff}
.lb button[disabled]{opacity:.25;cursor:default}
#lbx{top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
#lbp{left:max(12px,env(safe-area-inset-left,0px));top:50%;margin-top:-22px}
#lbn{right:max(12px,env(safe-area-inset-right,0px));top:50%;margin-top:-22px}
@media (max-width:860px){
  .lb{flex-direction:column;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:64px;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .lb-m{height:auto;flex:1 1 0;min-height:0;width:100%}
  .lb-m img,.lb-m video{height:100%;max-height:100%;max-width:100%}
  .lb-t{flex:0 0 auto;width:100%;font-size:13px;line-height:19px}
  .lb-t h2{font-size:17px;line-height:22px;margin-bottom:8px}
  #lbp,#lbn{top:auto;bottom:max(16px,env(safe-area-inset-bottom,0px));margin:0}
  #tt{display:none}
}
@media (prefers-reduced-motion:reduce){.bar,.prog i,.igm button{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="hall" id="hall"><div class="stage" id="stage"><div class="msg" id="msg">불러오는 중</div></div></div>
  <div class="prog" aria-hidden="true"><i id="pg"></i></div>
  <div class="bar" id="bar">
    <button type="button" id="pv" aria-label="이전 장">‹</button>
    <button type="button" id="nx" aria-label="다음 장">›</button>
    <span id="ct">00 / 00</span><span id="tt"></span>
    <span class="sp"></span>
    <button type="button" id="fs">전체화면</button>
  </div>
</div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="레퍼런스 크게 보기">
  <button type="button" id="lbp" aria-label="이전 컷">‹</button>
  <div class="lb-m" id="lbm"></div>
  <div class="lb-t"><h2><b id="lbh"></b><span id="lbs"></span></h2><p id="lbk"></p><p id="lbq"></p><div class="lb-a" id="lba"></div><div class="lb-c" id="lbc" style="padding:10px 0"></div></div>
  <button type="button" id="lbn" aria-label="다음 컷">›</button>
  <button type="button" id="lbx" aria-label="닫기">×</button>
</div>
<script src="meta.js?v=2"></script>
<script>
const $=id=>document.getElementById(id), M=window.META, VER=M.ver, N=M.n;
const pad=i=>String(i).padStart(2,'0');
const X0=[40,345,650,955];
let cur=1, slides=[], lbState=null, lastFocus=null;

(function(){const s=document.createElement('style'); s.textContent=M.css; document.head.appendChild(s);})();

function load(src,ok,fail,n){const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>{s.remove(); if((n||0)<2) setTimeout(()=>load(src,ok,fail,(n||0)+1),1000); else if(fail) fail();};document.head.appendChild(s);}

/* 무대 크기: 남는 공간 안에서 16:9 최대 */
function fit(){const h=$('hall'), st=$('stage'); const w=Math.floor(Math.min(h.clientWidth,h.clientHeight*16/9)); st.style.width=w+'px'; st.style.height=Math.round(w*9/16)+'px'; st.style.setProperty('--k',w/1280); slides.forEach(s=>s.querySelectorAll('.igm').forEach(m=>m._upd&&m._upd()));}
if(window.ResizeObserver) new ResizeObserver(fit).observe($('hall')); addEventListener('resize',fit);

function build(){
  const st=$('stage'); $('msg').hidden=true;
  for(let i=1;i<=N;i++){
    const d=document.createElement('div'); d.className='slide'; d.id='s'+pad(i);
    const pg=M.pages&&M.pages[i-1];
    d.innerHTML=pg?'<div class="pg" style="background:'+pg.bg+'"><div class="ovi">'+pg.html+'</div></div>':'<img src="'+window.PACK[VER][i-1]+'" alt="'+pad(i)+' '+M.titles[i-1]+'" draggable="false">';
    d.setAttribute('aria-label',pad(i)+' '+M.titles[i-1]);
    st.appendChild(d); slides.push(d);
  }
  fit(); go(fromHash(),true);
  M.live.forEach(k=>load(VER+'/live-'+pad(k)+'.js',()=>overlay(k)));
}

function overlay(k){
  const L=window.LIVE&&window.LIVE[VER]; const sl=slides[k-1]; if(!L||!L[k]||!sl||sl.querySelector('.ov')) return;
  const ov=document.createElement('div'); ov.className='ov'; ov.innerHTML='<div class="ovi">'+L[k]+'</div>'; sl.appendChild(ov);
  ov.querySelectorAll('.igm').forEach(m=>{
    const col=Math.round((parseFloat(m.style.left)-X0[0])/305);
    const t=m.querySelector('.trk'), n=t.children.length, pv=m.querySelector('.pv'), nx=m.querySelector('.nx'), dots=m.querySelectorAll('.dots i');
    const at=()=>Math.round(t.scrollLeft/(t.clientWidth||1));
    const upd=()=>{const i=at(); pv.disabled=i<=0; nx.disabled=i>=n-1; dots.forEach((x,j)=>x.classList.toggle('on',j===i));};
    const mv=s=>t.scrollTo({left:Math.max(0,Math.min(n-1,at()+s))*t.clientWidth,behavior:'smooth'});
    m._upd=upd; m._at=at; m._to=i=>t.scrollTo({left:i*t.clientWidth});
    pv.onclick=e=>{e.stopPropagation(); mv(-1);}; nx.onclick=e=>{e.stopPropagation(); mv(1);};
    t.addEventListener('scroll',upd,{passive:true}); upd();
    let x0=null, drag=false;
    t.addEventListener('pointerdown',e=>{x0=e.clientX; drag=false;});
    t.addEventListener('pointerup',e=>{if(x0===null) return; const dx=e.clientX-x0; x0=null; if(Math.abs(dx)>24){drag=true; if(e.pointerType==='mouse') mv(dx<0?1:-1);}});
    t.addEventListener('click',()=>{if(drag){drag=false; return;} openLB(k,col,at(),m);});
    m.querySelectorAll('video').forEach(v=>{v.removeAttribute('src'); v.preload='none';});   /* 칸 안에서는 표지만, 재생은 팝업에서 */
  });
}

function go(i,quiet){
  i=Math.max(1,Math.min(N,i)); cur=i;
  slides.forEach((s,j)=>s.classList.toggle('cur',j===i-1));
  $('ct').textContent=pad(i)+' / '+N; $('tt').textContent=M.titles[i-1]; $('pg').style.width=(i/N*100)+'%';
  $('pv').disabled=i<=1; $('nx').disabled=i>=N;
  slides[i-1].querySelectorAll('.igm').forEach(m=>m._upd&&m._upd());
  if(!quiet){try{history.replaceState(null,'','#s'+pad(i));}catch(e){try{location.hash='s'+pad(i);}catch(_){}}}
}
function fromHash(){const m=/^#s(\d{2})$/.exec(location.hash||''); return m?+m[1]:1;}
addEventListener('hashchange',()=>{if(slides.length) go(fromHash(),true);});
$('pv').onclick=()=>go(cur-1); $('nx').onclick=()=>go(cur+1);

/* 전체화면 */
const root=document.documentElement;
$('fs').onclick=()=>{try{const p=document.fullscreenElement?document.exitFullscreen():root.requestFullscreen(); if(p&&p.catch) p.catch(()=>{});}catch(e){}};
document.addEventListener('fullscreenchange',()=>{const f=!!document.fullscreenElement; $('app').classList.toggle('full',f); $('fs').textContent=f?'전체화면 종료':'전체화면'; wake(); fit();});
let idleT=null; function wake(){const a=$('app'); a.classList.remove('idle'); clearTimeout(idleT); if(document.fullscreenElement) idleT=setTimeout(()=>a.classList.add('idle'),2500);}
['mousemove','pointerdown','keydown'].forEach(e=>addEventListener(e,wake,{passive:true}));

/* 키보드 */
addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey) return; const k=e.key;
  if(lbState){
    if(k==='Escape'){closeLB(); e.preventDefault();}
    else if(k==='ArrowRight'||k==='PageDown'||k===' '){step(1); e.preventDefault();}
    else if(k==='ArrowLeft'||k==='PageUp'){step(-1); e.preventDefault();}
    return;
  }
  if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'){ if(k===' '||k==='Enter'){const a=document.activeElement; if(a&&a.tagName==='BUTTON') return;} go(cur+1); e.preventDefault();}
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){go(cur-1); e.preventDefault();}
  else if(k==='Home'){go(1); e.preventDefault();}
  else if(k==='End'){go(N); e.preventDefault();}
  else if(k==='f'||k==='F'){$('fs').click();}
});

/* 화면 밀기: 레퍼런스 칸 밖에서만 장 넘김 */
(function(){let x0=null,y0=0; const st=$('stage');
  st.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||e.target.closest('.igm')){x0=null; return;} x0=e.clientX; y0=e.clientY;});
  st.addEventListener('pointerup',e=>{if(x0===null) return; const dx=e.clientX-x0, dy=e.clientY-y0; x0=null; if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5) go(cur+(dx<0?1:-1));});
})();

/* 딤 팝업 */
function openLB(k,col,i,card){
  const r=M.refs[k]&&M.refs[k][col]; if(!r) return;
  lbState={k,col,i,r,card}; lastFocus=document.activeElement;
  $('lbh').textContent=r.hd; $('lbs').textContent=r.hs; $('lbs').hidden=!r.hs; $('lbk').textContent=r.key; $('lbq').textContent=r.pt;
  (function(){const b=$('lba'); b.innerHTML=''; (r.acc||[]).forEach((x,j)=>{if(j) b.appendChild(document.createTextNode(' · ')); if(x[1]){const l=document.createElement('a'); l.href=x[1]; l.target='_blank'; l.rel='noopener'; l.textContent=x[0]; b.appendChild(l);} else b.appendChild(document.createTextNode(x[0]));}); b.hidden=!(r.acc&&r.acc.length);})();
  $('lb').hidden=false; show(); $('lbx').focus();
}
function show(){
  const s=lbState, c=s.r.cuts[s.i], box=$('lbm'); box.innerHTML='';
  const low=(()=>{const el=s.card.querySelector('.trk').children[s.i]; const im=el&&el.querySelector('img'); const v=el&&el.querySelector('video'); return im?im.src:(v?v.poster:'');})();
  if(c.vid){
    const v=document.createElement('video'); v.src=c.vid; v.poster=low; v.muted=true; v.loop=true; v.playsInline=true; v.controls=true; v.autoplay=true; v.setAttribute('aria-label',s.r.hd+' 영상');
    box.appendChild(v); const p=v.play(); if(p&&p.catch) p.catch(()=>{});
  }else{
    const im=document.createElement('img'); im.alt=s.r.hd+' '+(s.i+1); im.draggable=false; im.src=low; box.appendChild(im);
    const hi=new Image(); hi.onload=()=>{if(lbState===s&&s.r.cuts[s.i]===c&&im.isConnected) im.src=hi.src;}; hi.src=c.img;
  }
  const n=s.r.cuts.length; $('lbc').textContent=(s.i+1)+' / '+n+(c.vid?' · 영상':''); $('lbp').disabled=s.i<=0; $('lbn').disabled=s.i>=n-1;
  $('lbp').hidden=$('lbn').hidden=n<2;
}
function step(d){const s=lbState; if(!s) return; const j=s.i+d; if(j<0||j>=s.r.cuts.length) return; s.i=j; show();}
function closeLB(){const s=lbState; if(!s) return; $('lbm').innerHTML=''; $('lb').hidden=true; lbState=null; if(s.card._to) s.card._to(0);   /* 팝업을 닫으면 칸의 캐러셀은 1번 컷으로 되돌림 */ if(lastFocus&&lastFocus.focus) try{lastFocus.focus();}catch(e){}}
$('lbx').onclick=closeLB; $('lbp').onclick=e=>{e.stopPropagation(); step(-1);}; $('lbn').onclick=e=>{e.stopPropagation(); step(1);};
$('lb').addEventListener('click',e=>{if(e.target===$('lb')||e.target===$('lbm')) closeLB();});

if(M.pages&&M.pages.length===N) build(); else load(VER+'/pack.js',build,()=>{$('msg').textContent='불러오기 실패 · 새로 고침';});
</script>

</body>
</html>
